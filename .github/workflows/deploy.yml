# Сборка, проверка и деплой на Cloudflare Workers при пуше в main.
# Секреты (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — токен по шаблону "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID — ID аккаунта Cloudflare
# Пока секретов нет, деплой пропускается, а сборка и проверка идут.
name: Деплой на Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run preflight
      - name: Деплой
        if: github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy
